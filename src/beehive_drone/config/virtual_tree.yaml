# Konfigurasi launch untuk pengujian satu pohon nyata/SDF dan satu pohon
# virtual. Pohon virtual dibuat setelah orbit pertama selesai, sejauh
# virtual_tree_offset meter dari pohon pertama ke arah home.
virtual_tree_mission:
  launch_arguments:
    auto_start: true
    tree_source: sdf
    tree_world: plantation_737c519.sdf
    source_tree_limit: 1
    mission_type: virtual_tree_test
    mission_mode: multi_tree
    max_trees: 2
    virtual_tree_offset: 6.0
    require_tree_ahead: true
    expected_tree_count: 1
    report_output_directory: ~/beehive_mission_reports/virtual_tree_test
