tree_mapper:
  ros__parameters:
    frame_id: odom
    merge_distance: 1.0
    minimum_seen_count: 3
    min_radius: 0.10
    max_radius: 0.65
    min_height: 0.8
    max_height: 8.0
    position_alpha: 0.25

mission_state_machine:
  ros__parameters:
    flight_altitude: 3.0
    require_safety_monitor: false
    auto_start: true
    state_timeout: 120.0
    pose_timeout: 5.0
    abort_mode: ""

dynamic_orbit_controller:
  ros__parameters:
    orbit_radius: 1.5
    orbit_altitude: 1.0
    orbit_velocity: 0.25
    orbit_timeout: 90.0
    radial_tolerance: 0.2
    yaw_offset: 0.0
    completion_tolerance_degrees: 3.0

velocity_controller:
  ros__parameters:
    minimum_control_altitude: 0.20

mission_safety_monitor:
  ros__parameters:
    pointcloud_topic: /zed2i/depth/points
    range_topic: /mavros/rangefinder/rangefinder
    require_rangefinder: false
    pose_timeout: 5.0
    cloud_timeout: 3.0
