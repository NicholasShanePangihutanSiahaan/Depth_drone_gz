/**:
  ros__parameters:
    altitude_mode: terrain_following

pcl_proc_node:
  ros__parameters:
    use_transform_pcl: true
    min_sensor_range: 0.3
    max_sensor_range: 15.0
    voxel_leaf_size: 0.20
    processing_period_ms: 500
    camera_offset_x: 0.0
    camera_offset_y: 0.0
    camera_offset_z: 0.0
    camera_mount_roll: 0.0
    camera_mount_pitch: 0.0
    camera_mount_yaw: 0.0

tree_mapper:
  ros__parameters:
    frame_id: odom
    merge_distance: 1.0
    minimum_seen_count: 3
    min_radius: 0.10
    max_radius: 0.65
    min_height: 0.8
    max_height: 8.0
    max_trunk_base_height: 0.65
    min_cylinder_confidence: 0.20
    position_alpha: 0.25

mission_state_machine:
  ros__parameters:
    lidar_verification_timeout: 8.0    # Batas menunggu validasi LiDAR (detik).
    lidar_max_position_correction: 0.8 # Maksimum koreksi yang diterima FSM (m).
    require_lidar_verification: true
    adaptive_orbit_enabled: true
    adaptive_orbit_fraction: 0.5
    adaptive_orbit_min_height: 1.0
    adaptive_orbit_max_height: 4.0
    flight_altitude: 1.5
    # Sama dengan konfigurasi real: berhenti 1.5 m dari pusat batang.
    approach_distance: 1.5
    tree_distance_tolerance: 0.5
    approach_goal_tolerance: 0.15
    verification_retry_limit: 3
    require_safety_monitor: false
    auto_start: true
    state_timeout: 300.0
    pose_timeout: 5.0
    post_takeoff_hover_time: 2.0
    require_vision_before_start: false
    vision_pose_topic: /mavros/vision_pose/pose
    vision_pose_timeout: 1.0
    vision_warmup_time: 0.0
    abort_mode: ""

dynamic_orbit_controller:
  ros__parameters:
    orbit_radius: 1.5
    orbit_altitude: 1.5
    orbit_velocity: 0.25
    orbit_timeout: 180.0
    radial_tolerance: 0.3
    yaw_offset: 0.0
    completion_tolerance_degrees: 2.0

flight_manager:
  ros__parameters:
    altitude_source: rangefinder
    hover_tolerance: 0.35
    rangefinder_topic: /simulation/rangefinder
    rangefinder_timeout: 1.0
    rangefinder_min_valid: 0.08
    rangefinder_max_valid: 8.0
    rangefinder_altitude_offset: 0.0

position_setpoint_controller:
  ros__parameters:
    publish_rate: 20.0
    max_horizontal_step: 0.10
    max_vertical_step: 0.05
    target_timeout: 0.75
    output_frame: map
    rangefinder_topic: /simulation/rangefinder
    rangefinder_timeout: 0.50
    rangefinder_min_valid: 0.08
    rangefinder_max_valid: 8.0
    rangefinder_altitude_offset: 0.0
    range_filter_alpha: 0.35
    range_median_window: 5
    minimum_tilt_cosine: 0.70
    max_terrain_correction: 1.0
    max_terrain_target_rate: 0.50

velocity_controller:
  ros__parameters:
    minimum_control_altitude: 0.20
    # Harus lebih kecil dari approach_goal_tolerance (0.15 m), agar
    # controller tidak berhenti sebelum FSM menyatakan titik tercapai.
    goal_threshold: 0.08

mission_safety_monitor:
  ros__parameters:
    pointcloud_topic: /zed2i/depth/points
    range_topic: /simulation/rangefinder
    require_rangefinder: true
    pose_timeout: 5.0
    cloud_timeout: 3.0
    range_timeout: 5.0
    min_range: 0.08
    max_range: 8.0

mission_analyzer:
  ros__parameters:
    output_directory: ~/beehive_mission_reports/sim
    map_frame: map
    sample_period: 0.20
    console_period: 2.0
    autosave_period: 10.0
    rangefinder_topic: /simulation/rangefinder
    expected_takeoff_altitude: 1.5
    expected_approach_distance: 1.5
    expected_orbit_radius: 1.5

# Tuning LiDAR; restart launch setelah mengubah parameter.
lidar_tree_verifier:
  ros__parameters:
    lidar_topic: /livox/top/points
    target_frame: odom                 # Harus sama dengan frame kandidat kamera.
    association_radius: 0.8            # Radius ROI titik dari kandidat kamera (m).
    max_center_offset: 0.6             # Maksimum koreksi pusat lingkaran (m).
    min_points: 30                     # Minimum titik dalam ROI.
    slice_height: 0.25                 # Tebal lapisan horizontal (m).
    min_slice_points: 6                # Minimum titik/inlier tiap lapisan.
    ransac_iterations: 60
    min_radius: 0.10                   # Radius batang (m).
    max_radius: 0.65
    circle_tolerance: 0.035            # Jarak titik ke lingkaran yang diterima (m).
    min_inlier_ratio: 0.6              # Fraksi titik pendukung, rentang (0, 1].
    min_arc_coverage: 0.5              # Cakupan busur minimum (radian).
    min_slices: 4                      # Minimum lapisan yang cocok.
    slice_center_tolerance: 0.12       # Toleransi keselarasan pusat lapisan (m).
    min_vertical_span: 0.75            # Rentang vertikal lapisan yang cocok (m).
    surface_tolerance: 0.06            # Ketebalan seleksi permukaan batang (m).
    bottom_percentile: 3.0             # Persentil Z untuk bagian bawah/atas.
    top_percentile: 97.0
    min_height: 0.8                    # Tinggi batang teramati minimum (m).
    scan_window: 5                     # Jumlah maksimum scan dalam median.
    min_consistent_scans: 3            # Harus <= scan_window dan >= 2.
    scan_center_tolerance: 0.15         # Perubahan pusat antar-scan (m).
    max_height_variation: 0.5          # Rentang variasi tinggi dalam window (m).
    processing_period: 0.15            # Periode pemrosesan (detik).
    scan_timeout: 1.0                  # Umur maksimum scan sejak diterima (detik).
    candidate_timeout: 1.0             # Umur permintaan kandidat (detik).
    max_scan_gap: 1.0                  # Reset window jika jeda scan valid > ini.
