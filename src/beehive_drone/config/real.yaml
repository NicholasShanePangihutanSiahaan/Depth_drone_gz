tree_mapper:
  ros__parameters:
    frame_id: odom
    merge_distance: 0.8
    minimum_seen_count: 5
    min_radius: 0.10
    max_radius: 0.65
    min_height: 1.0
    max_height: 8.0
    position_alpha: 0.20

mission_state_machine:
  ros__parameters:
    flight_altitude: 3.0
    require_safety_monitor: true
    auto_start: false
    state_timeout: 120.0
    pose_timeout: 0.75

dynamic_orbit_controller:
  ros__parameters:
    orbit_radius: 3.5
    orbit_altitude: 3.0
    orbit_velocity: 0.5
    orbit_timeout: 120.0
    radial_tolerance: 0.7

position_setpoint_controller:
  ros__parameters:
    publish_rate: 20.0
    max_horizontal_step: 0.10
    max_vertical_step: 0.05
    target_timeout: 0.75
    output_frame: map

mission_safety_monitor:
  ros__parameters:
    pointcloud_topic: /zed/zed_node/point_cloud/cloud_registered
    range_topic: /mavros/rangefinder/rangefinder
    require_rangefinder: true
    pose_timeout: 0.75
    cloud_timeout: 2.0
    state_timeout: 1.0
    range_timeout: 1.0
    min_range: 0.08
    max_range: 20.0

