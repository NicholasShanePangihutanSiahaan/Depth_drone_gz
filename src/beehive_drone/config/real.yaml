/**:
  ros__parameters:
    altitude_mode: home_relative

pcl_proc_node:
  ros__parameters:
    # Dipertahankan untuk replay/legacy pcl_proc_node. Pada penerbangan real,
    # /global_cylinders diterbitkan oleh bb_pcl_proc_node.
    # cloud_registered memakai sumbu ROS: X depan, Y kiri, Z atas.
    use_transform_pcl: false
    min_sensor_range: 0.4
    max_sensor_range: 12.0
    voxel_leaf_size: 0.15
    processing_period_ms: 500
    global_frame_id: map
    # Ukur offset origin base_link ke optical center ZED2i pada drone.
    camera_offset_x: 0.0
    camera_offset_y: 0.0
    camera_offset_z: 0.0
    camera_mount_roll: 0.0
    camera_mount_pitch: 0.0
    camera_mount_yaw: 0.0

vision_to_mavros:
  ros__parameters:
    input_topic: /zed/zed_node/pose
    output_topic: /mavros/vision_pose/pose
    replace_zero_timestamp: true

flight_manager:
  ros__parameters:
    # Gate takeoff/hover menggunakan tinggi AGL dari lidar bawah.
    altitude_source: rangefinder
    hover_tolerance: 0.2
    rangefinder_topic: /mavros/rangefinder/rangefinder
    rangefinder_timeout: 1.0
    rangefinder_min_valid: 0.08
    rangefinder_max_valid: 8.0
    # Offset vertikal base_link terhadap pusat lidar, jika diperlukan.
    rangefinder_altitude_offset: 0.0

tree_mapper:
  ros__parameters:
    frame_id: map
    merge_distance: 0.8
    minimum_seen_count: 5
    min_radius: 0.10
    # BB node melaporkan radius dari ukuran bounding box objek, bukan hanya
    # radius batang hasil cylinder fitting.
    max_radius: 4.0
    min_height: 1.0
    max_height: 8.0
    max_trunk_base_height: 3.0
    min_cylinder_confidence: 0.25
    position_alpha: 0.20

mission_state_machine:
  ros__parameters:
    lidar_verification_timeout: 8.0    # Batas menunggu validasi LiDAR (detik).
    lidar_max_position_correction: 0.8 # Maksimum koreksi yang diterima FSM (m).
    require_lidar_verification: false
    adaptive_orbit_enabled: false
    adaptive_orbit_fraction: 0.5
    adaptive_orbit_min_height: 1.0
    adaptive_orbit_max_height: 4.0
    # Default mempertahankan perilaku Jetson teruji: satu pohon lalu pulang.
    mission_mode: single_tree
    # Hanya digunakan pada multi_tree; 0 berarti tanpa batas jumlah.
    max_trees: 0
    flight_altitude: 1.9
    # Jarak horizontal titik approach terhadap pusat batang.
    approach_distance: 2.6
    tree_distance_tolerance: 0.5
    approach_goal_tolerance: 0.15
    verification_retry_limit: 3
    # Mission-first: monitor tetap mencatat diagnosis, tetapi cloud/range
    # dropout tidak langsung membatalkan misi dan memaksa BRAKE.
    require_safety_monitor: false
    # Aman secara default: misi dimulai melalui /mission/start setelah preflight.
    auto_start: false
    state_timeout: 300.0
    pose_timeout: 5.0
    post_takeoff_hover_time: 5.0
    align_yaw_tolerance_degrees: 7.5
    align_yaw_hold_time: 1.5
    require_frame_alignment: false
    # Bridge dijalankan terpisah. Misi menunggu aliran vision stabil agar
    # auto_start tidak beradu dengan inisialisasi ExternalNav/EKF.
    require_vision_before_start: true
    vision_pose_topic: /mavros/vision_pose/pose
    vision_pose_timeout: 1.0
    vision_warmup_time: 5.0
    abort_mode: BRAKE

dynamic_orbit_controller:
  ros__parameters:
    orbit_radius: 2.6
    orbit_altitude: 1.9
    orbit_velocity: 0.55
    orbit_timeout: 180.0
    radial_tolerance: 0.3
    yaw_offset: 0.0
    completion_tolerance_degrees: 2.0

position_setpoint_controller:
  ros__parameters:
    publish_rate: 20.0
    # 0.015 m * 20 Hz = commanded-target slew maksimum 0.30 m/s.
    max_horizontal_step: 0.03
    max_vertical_step: 0.05
    target_timeout: 0.75
    output_frame: map
    # EKF tetap memakai local-Z yang halus; rangefinder hanya menggeser target
    # vertikal agar clearance terhadap permukaan tetap 1.5 m.
    rangefinder_topic: /mavros/rangefinder/rangefinder
    rangefinder_timeout: 0.50
    rangefinder_min_valid: 0.08
    rangefinder_max_valid: 8.0
    rangefinder_altitude_offset: 0.0
    range_filter_alpha: 0.35
    range_median_window: 5
    minimum_tilt_cosine: 0.70
    max_terrain_correction: 1.0
    max_terrain_target_rate: 0.50

# Dipakai jika real launch dialihkan ke kontrol kecepatan untuk tuning.
velocity_controller:
  ros__parameters:
    minimum_control_altitude: 0.20
    # Sisakan margin terhadap approach_goal_tolerance (0.15 m).
    goal_threshold: 0.10

mission_safety_monitor:
  ros__parameters:
    # Jalur BB tidak membutuhkan point cloud yang dipublikasikan. Heartbeat
    # persepsi diambil dari hasil tracking BB, termasuk array kosong.
    pointcloud_topic: ''
    tracked_cylinders_topic: /global_cylinders
    range_topic: /mavros/rangefinder/rangefinder
    # Diagnostik saja selama tahap mission-first.
    require_rangefinder: true
    pose_timeout: 5.0
    cloud_timeout: 5.0
    state_timeout: 5.0
    range_timeout: 5.0
    range_arm_grace: 5.0
    min_range: 0.08
    max_range: 8.0

mission_analyzer:
  ros__parameters:
    output_directory: ~/beehive_mission_reports/real
    map_frame: map
    sample_period: 0.20
    console_period: 2.0
    autosave_period: 10.0
    rangefinder_topic: /mavros/rangefinder/rangefinder
    expected_takeoff_altitude: 1.5
    expected_approach_distance: 1.5
    expected_orbit_radius: 1.5

# Tuning LiDAR; restart launch setelah mengubah parameter.
lidar_tree_verifier:
  ros__parameters:
    lidar_topic: /livox/top/points
    target_frame: odom                 # Harus sama dengan frame kandidat kamera.
    association_radius: 0.8            # Radius ROI titik dari kandidat kamera (m).
    max_center_offset: 0.6             # Maksimum koreksi pusat lingkaran (m).
    min_points: 30                     # Minimum titik dalam ROI.
    slice_height: 0.25                 # Tebal lapisan horizontal (m).
    min_slice_points: 6                # Minimum titik/inlier tiap lapisan.
    ransac_iterations: 60
    min_radius: 0.10                   # Radius batang (m).
    max_radius: 0.65
    circle_tolerance: 0.035            # Jarak titik ke lingkaran yang diterima (m).
    min_inlier_ratio: 0.6              # Fraksi titik pendukung, rentang (0, 1].
    min_arc_coverage: 0.5              # Cakupan busur minimum (radian).
    min_slices: 4                      # Minimum lapisan yang cocok.
    slice_center_tolerance: 0.12       # Toleransi keselarasan pusat lapisan (m).
    min_vertical_span: 0.75            # Rentang vertikal lapisan yang cocok (m).
    surface_tolerance: 0.06            # Ketebalan seleksi permukaan batang (m).
    bottom_percentile: 3.0             # Persentil Z untuk bagian bawah/atas.
    top_percentile: 97.0
    min_height: 0.8                    # Tinggi batang teramati minimum (m).
    scan_window: 5                     # Jumlah maksimum scan dalam median.
    min_consistent_scans: 3            # Harus <= scan_window dan >= 2.
    scan_center_tolerance: 0.15         # Perubahan pusat antar-scan (m).
    max_height_variation: 0.5          # Rentang variasi tinggi dalam window (m).
    processing_period: 0.15            # Periode pemrosesan (detik).
    scan_timeout: 1.0                  # Umur maksimum scan sejak diterima (detik).
    candidate_timeout: 1.0             # Umur permintaan kandidat (detik).
    max_scan_gap: 1.0                  # Reset window jika jeda scan valid > ini.
